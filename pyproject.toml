[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentrix"
version = "0.1.0"
description = "SentriX — Multi-Step Attack Simulation and Risk-Path Analysis Agent"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.30",
    "networkx>=3.0",
    "pandas>=2.0",
    "plotly>=5.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
